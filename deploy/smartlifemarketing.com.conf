upstream gpt_money_backend {
    server 127.0.0.1:8807;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartlifemarketing.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartlifemarketing.com;

    ssl_certificate /etc/nginx/certs/smartlifemarketing.com_cert.pem;
    ssl_certificate_key /etc/nginx/certs/smartlifemarketing.com_key.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://gpt_money_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
