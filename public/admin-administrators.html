<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员管理 - 共享拼单平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">ADMIN CONSOLE</p><h1>管理员管理</h1><p class="muted">创建和维护次级管理员。次级管理员不能修改订阅、套餐或支付配置。</p></div></header>
    <nav class="admin-subnav" aria-label="管理员功能切换">
      <a class="admin-subtab" href="/admin-users.html">用户管理</a><a class="admin-subtab" href="/admin-accounts.html">邮箱账号池</a><a class="admin-subtab" href="/admin-plans.html">付费套餐</a><a class="admin-subtab" href="/admin-payment.html">支付管理</a><a class="admin-subtab" href="/admin-orders.html">订单管理</a><a class="admin-subtab" href="/admin-announcements.html">公告管理</a><a class="admin-subtab" href="/admin-support.html">客服中心</a><a class="admin-subtab active" href="/admin-administrators.html">管理员管理</a>
    </nav>
    <section class="card">
      <div class="section-title"><span class="step">+</span><div><h2>创建次级管理员</h2><p>次级管理员可以处理用户、邮箱账号、公告和客服工作，但没有订阅和支付权限。</p></div></div>
      <div class="grid three admin-create"><label>登录账号<input id="adminAccount" autocomplete="off" placeholder="例如 support-01"></label><label>登录密码<input id="adminPassword" type="password" autocomplete="new-password" placeholder="至少 8 位"></label><label>确认密码<input id="adminConfirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码"></label></div>
      <div class="actions"><button id="createAdminBtn" class="primary">创建次级管理员</button><button id="refreshAdminBtn">刷新列表</button></div><p id="adminResult" class="result"></p>
    </section>
    <section id="primaryPasswordCard" class="card">
      <div class="section-title"><span class="step">P</span><div><h2>修改主管理员密码</h2><p>需要验证当前密码；修改成功后，其他设备上的登录会话将失效。</p></div></div>
      <form id="primaryPasswordForm" class="profile-form">
        <div class="grid three">
          <label>当前密码<input id="primaryCurrentPassword" type="password" autocomplete="current-password" required></label>
          <label>新密码<input id="primaryNewPassword" type="password" autocomplete="new-password" minlength="8" required></label>
          <label>确认新密码<input id="primaryConfirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        </div>
        <div class="actions"><button id="savePrimaryPasswordBtn" class="primary" type="submit">保存新密码</button></div>
        <p id="primaryPasswordResult" class="result"></p>
      </form>
    </section>
    <section class="card"><div class="section-title"><span class="step">A</span><div><h2>管理员列表</h2><p>主管理员可修改自己的密码，但不可在此删除。</p></div></div><div id="adminRows" class="admin-list"><div class="empty-state">正在加载…</div></div></section>
  </main>
  <script src="/auth-storage.js"></script><script src="/admin-auth.js"></script><script src="/admin-administrators.js?v=20261003-2"></script>
</body>
</html>
