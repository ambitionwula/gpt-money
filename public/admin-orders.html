<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单管理 - 共享拼单平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">ADMIN CONSOLE</p><h1>订单管理</h1><p class="muted">查看订单、核对第三方支付流水，并处理人工确认或异常关闭。</p></div>
    </header>
    <nav class="admin-subnav" aria-label="管理员功能切换">
      <a class="admin-subtab" href="/admin-users.html">用户管理</a>
      <a class="admin-subtab" href="/admin-accounts.html">邮箱账号池</a>
      <a class="admin-subtab" href="/admin-plans.html">付费套餐</a>
      <a class="admin-subtab" href="/admin-payment.html">支付管理</a>
      <a class="admin-subtab active" href="/admin-orders.html">订单管理</a>
      <a class="admin-subtab" href="/admin-announcements.html">公告管理</a>
      <a class="admin-subtab" href="/admin-support.html">客服中心</a>
    </nav>
    <section class="card">
      <div class="section-title"><span class="step">O</span><div><h2>支付订单</h2><p>订单记录独立管理，支付配置请进入“支付管理”。</p></div></div>
      <div id="paymentOrderSummary" class="payment-order-summary">正在统计订单…</div>
      <div class="payment-order-filters"><input id="paymentOrderSearch" type="search" placeholder="搜索订单号、用户 ID、第三方流水号"><select id="paymentOrderStatus"><option value="">全部状态</option><option value="pending">待支付</option><option value="paid">已到账</option><option value="closed">已关闭</option></select><button id="refreshPaymentOrdersBtn">刷新订单</button></div>
      <div class="table-wrap"><table><thead><tr><th>订单号</th><th>用户</th><th>套餐</th><th>金额</th><th>状态</th><th>创建时间</th><th>支付信息</th><th>操作</th></tr></thead><tbody id="paymentOrderRows"><tr><td colspan="8">正在加载…</td></tr></tbody></table></div>
      <p id="paymentOrdersResult" class="result"></p>
    </section>
  </main>
  <script src="/auth-storage.js"></script>
  <script src="/admin-auth.js"></script>
  <script src="/admin-orders.js"></script>
</body>
</html>
